<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="'Helvetica Neue', Helvetica, Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <pattern id="diag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#10B981" stroke-width="2.5" opacity="0.55"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111">每機櫃 10 年總持有成本 (TCO)</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#555">100 kW-class rack · 8× BBU · USD · 來源:Sysblade v2.2 §G.3</text>

  <!-- Y axis -->
  <line x1="80" y1="80" x2="80" y2="420" stroke="#999" stroke-width="1"/>
  <line x1="80" y1="420" x2="500" y2="420" stroke="#999" stroke-width="1"/>

  <!-- Y-axis ticks -->
  <g font-size="11" fill="#666">
    <text x="74" y="424" text-anchor="end">$0</text>
    <line x1="78" y1="420" x2="80" y2="420" stroke="#999"/>
    <text x="74" y="364" text-anchor="end">$5k</text>
    <line x1="78" y1="365" x2="80" y2="365" stroke="#999"/>
    <text x="74" y="309" text-anchor="end">$10k</text>
    <line x1="78" y1="310" x2="80" y2="310" stroke="#999"/>
    <text x="74" y="255" text-anchor="end">$15k</text>
    <line x1="78" y1="255" x2="80" y2="255" stroke="#999"/>
    <text x="74" y="200" text-anchor="end">$20k</text>
    <line x1="78" y1="200" x2="80" y2="200" stroke="#999"/>
    <text x="74" y="145" text-anchor="end">$25k</text>
    <line x1="78" y1="145" x2="80" y2="145" stroke="#999"/>
    <text x="74" y="90" text-anchor="end">$30k</text>
    <line x1="78" y1="90" x2="80" y2="90" stroke="#999"/>
  </g>

  <!-- Gridlines -->
  <g stroke="#eee" stroke-width="1">
    <line x1="80" y1="365" x2="500" y2="365"/>
    <line x1="80" y1="310" x2="500" y2="310"/>
    <line x1="80" y1="255" x2="500" y2="255"/>
    <line x1="80" y1="200" x2="500" y2="200"/>
    <line x1="80" y1="145" x2="500" y2="145"/>
    <line x1="80" y1="90" x2="500" y2="90"/>
  </g>

  <!-- ============ TRADITIONAL bar (centered at x=200, width=110) ============ -->
  <!-- Stacked bottom→top: Initial, Replacements, Transient, Ops, HVDC -->
  <!-- Scale: 1 USD = 0.01103 px; baseline y=420 -->

  <!-- Initial 5,760 → h=63.5 -->
  <rect x="145" y="356.5" width="110" height="63.5" fill="#5B8FF9"/>
  <text x="200" y="392" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$5,760</text>

  <!-- Replacements 8,640 → h=95.3 -->
  <rect x="145" y="261.2" width="110" height="95.3" fill="#1E3A8A"/>
  <text x="200" y="312" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$8,640</text>

  <!-- Transient 4,800 → h=52.9 -->
  <rect x="145" y="208.3" width="110" height="52.9" fill="#F59E0B"/>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$4,800</text>

  <!-- Ops 5,000 → h=55.1 -->
  <rect x="145" y="153.2" width="110" height="55.1" fill="#10B981"/>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$5,000</text>

  <!-- HVDC 4,800 → h=52.9 -->
  <rect x="145" y="100.3" width="110" height="52.9" fill="#6B7280"/>
  <text x="200" y="131" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$4,800</text>

  <!-- Total label -->
  <text x="200" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#111">$29,000</text>
  <text x="200" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">傳統 NMC BBU</text>
  <text x="200" y="461" text-anchor="middle" font-size="11" fill="#9CA3AF">Lead-acid / NMC baseline</text>

  <!-- ============ SYSBLADE bar (centered at x=380, width=110) ============ -->
  <!-- Initial 8,640 → h=95.3 -->
  <rect x="325" y="324.7" width="110" height="95.3" fill="#5B8FF9"/>
  <text x="380" y="376" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$8,640</text>

  <!-- Replacements 5,760 → h=63.5 -->
  <rect x="325" y="261.2" width="110" height="63.5" fill="#1E3A8A"/>
  <text x="380" y="296" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">$5,760</text>

  <!-- Transient 1,200 → h=13.2 -->
  <rect x="325" y="248.0" width="110" height="13.2" fill="#F59E0B"/>
  <text x="380" y="258" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$1.2k</text>

  <!-- Ops 2,000 → h=22.1 -->
  <rect x="325" y="225.9" width="110" height="22.1" fill="#10B981"/>
  <text x="380" y="240" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$2,000</text>

  <!-- HVDC 1,800 → h=19.9 -->
  <rect x="325" y="206.0" width="110" height="19.9" fill="#6B7280"/>
  <text x="380" y="220" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">$1,800</text>

  <!-- Sysblade savings ghost block (showing what would have been spent) -->
  <rect x="325" y="100.3" width="110" height="105.7" fill="url(#diag)" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="380" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">節省 $9,600</text>
  <text x="380" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#0F766E">≈ 33%</text>

  <!-- Sysblade total label (placed beside the bar so it doesn't sit inside the savings ghost) -->
  <text x="450" y="210" text-anchor="start" font-size="14" font-weight="700" fill="#111">$19,400</text>
  <line x1="437" y1="206" x2="448" y2="208" stroke="#111" stroke-width="1"/>
  <text x="380" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#0F766E">Sysblade HyperBuffer</text>
  <text x="380" y="461" text-anchor="middle" font-size="11" fill="#9CA3AF">LIC + LFP 15S Hybrid</text>

  <!-- Savings arrow -->
  <line x1="262" y1="100.3" x2="318" y2="100.3" stroke="#0F766E" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="262" y1="206.0" x2="318" y2="206.0" stroke="#0F766E" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- ============ LEGEND (right side) ============ -->
  <g font-size="12" fill="#374151">
    <text x="540" y="100" font-weight="700" fill="#111">10 年成本構成</text>

    <rect x="540" y="115" width="14" height="14" fill="#6B7280"/>
    <text x="560" y="126">HVDC 過渡</text>

    <rect x="540" y="138" width="14" height="14" fill="#10B981"/>
    <text x="560" y="149">營運人力</text>

    <rect x="540" y="161" width="14" height="14" fill="#F59E0B"/>
    <text x="560" y="172">瞬態損失 (突波/重啟)</text>

    <rect x="540" y="184" width="14" height="14" fill="#1E3A8A"/>
    <text x="560" y="195">電池替換 (1.5× vs 1×)</text>

    <rect x="540" y="207" width="14" height="14" fill="#5B8FF9"/>
    <text x="560" y="218">初始採購</text>

    <rect x="540" y="234" width="14" height="14" fill="url(#diag)" stroke="#10B981" stroke-width="1"/>
    <text x="560" y="245" fill="#0F766E" font-weight="600">Sysblade 節省區塊</text>
  </g>

  <!-- ============ Bottom callouts ============ -->
  <g font-size="11" fill="#374151">
    <text x="540" y="285" font-weight="700" fill="#111">關鍵節省來源</text>
    <text x="540" y="305">▸ 替換次數 1.5× → 1×</text>
    <text x="540" y="322">  (LFP 4000 cycle vs NMC 1500)</text>
    <text x="540" y="345">▸ 瞬態損失 −75%</text>
    <text x="540" y="362">  (LIC 30 ms 吸收)</text>
    <text x="540" y="385">▸ 預測式營運 −60%</text>
    <text x="540" y="402">  (Twin + RUL 預警)</text>
  </g>

  <!-- Footer -->
  <text x="80" y="498" font-size="10" fill="#9CA3AF">資料來源:apps/web/src/lib/tco.ts (v2.2 §G.3 表) · 假設 $0.10/kWh, PUE 1.4</text>
</svg>
